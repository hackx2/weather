worker_processes 1;
daemon off;
events {
    worker_connections 1024;
}

http {
    types {
        image/jpeg jpg jpeg;
        image/png png;
        image/gif gif;
        image/webp webp;
        image/avif avif;
        video/mp4 mp4;
        video/webm webm;
    }
    client_max_body_size 100m;

    server {
        listen 3002;

        location /data/ {
            alias ../data/;
            add_header X-Content-Type-Options nosniff;
        }

        location / {
            # redirect to our frontend
            proxy_pass http://127.0.0.1:3000;
        }
    }
}
